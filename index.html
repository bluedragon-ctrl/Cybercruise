<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cybercruise</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="frame">
    <!-- These attributes are the pre-script fallback only. src/engine/viewport.js
         overwrites both on load, sizing the backing store from the window and the
         device pixel ratio; 600x800 is the game's LOGICAL playfield, which never
         changes. See that file for the fit/scale/dpr split. -->
    <canvas id="game" width="600" height="800"></canvas>
    <!-- The present surface (src/engine/present.js): the finished 2D frame
         above, uploaded as a texture and blitted back out through WebGL2. A
         SECOND ELEMENT because a 2D and a WebGL context cannot share a canvas.

         It is out of flow and starts hidden, both of which matter. #frame is
         shrink-wrapped to #game and the viewport measures #game to work out how
         much of the window the cabinet's chrome eats, so a second in-flow canvas
         would either double the cabinet's height or take a vote in its size.
         Hidden until src/engine/present.js has a live WebGL2 context; css/
         style.css does the swap off a class on #frame. -->
    <canvas id="present" width="600" height="800" aria-hidden="true"></canvas>
    <!-- The HUD layer (src/main.js's drawHud, src/engine/present.js's header,
         README's Phase 15c): a THIRD canvas, plain 2D, transparent, sitting on
         top of #present. Never uploaded to the GPU and never bloomed — the
         instrument readouts, the menu's test rows and the shop's price list
         all live here instead of on #game, which is what lets
         BLOOM_THRESHOLD/BLOOM_EXPOSURE be tuned for the world alone rather
         than for what dense text can survive. Composited onto #present by the
         browser (the same "layer transform, no per-frame re-raster" trick
         #present already gets over #game — see css/style.css), which is why
         this is a DOM layer and not a second WebGL texture; present.js's
         header has the cost argument. Mirrored 1:1 with the other two
         canvases (src/engine/viewport.js's mirrorCanvas) and, like #present,
         NEVER A CLICK TARGET — engine/mouse.js binds to #game alone. -->
    <canvas id="hud" width="600" height="800" aria-hidden="true"></canvas>
    <!-- WebGL2 is REQUIRED as of Phase 15d-i (src/engine/gl/context.js's
         header has the reversal and why) — this is the whole of what a
         machine without it, or a context lost mid-run, gets instead of a
         haloless game. Plain DOM, not drawn on any canvas above, because
         the one case this exists for is the one where the thing that draws
         text is the thing that is missing. src/engine/present.js toggles
         `hidden`, writes the two lines of text, and adds `fatal` for the
         no-WebGL2-at-all case — see its showNotice(). Positioned to cover
         all three canvases entirely (css/style.css), so neither a stale 2D
         frame, an undefined WebGL drawing buffer nor a stale HUD is ever
         what is actually on
         screen while this is up. -->
    <div id="gl-notice" class="gl-notice" hidden>
      <div class="gl-notice-title"></div>
      <div class="gl-notice-body"></div>
    </div>
    <div id="hint">&uarr;/&darr; select &middot; &larr;/&rarr; adjust &middot; SPACE/ENTER confirm</div>
  </div>

  <!-- The gutter panels: the deck's own readouts, filling the screen either side
       of the cabinet on a window wider than 3:4. Declared here as empty shells
       and positioned entirely from src/engine/gutter.js, which measures #frame
       and hangs them off its edges.

       OUTSIDE #frame, AND FIXED IN THE STYLESHEET, both of which matter.
       engine/viewport.js sizes the playfield against window.innerWidth directly,
       so anything in normal flow beside the cabinet would not be accounted for
       and the two would overlap. Being out of flow is what makes these panels
       structurally incapable of shrinking the game. They are also aria-hidden:
       the log is atmosphere built from numbers the HUD already states plainly,
       and reading 34 rows of pseudo-syscalls aloud would bury the real ones. -->
  <aside id="gutter-log" class="gutter" aria-hidden="true">
    <div class="gutter-title">SYS LOG // DECK 01</div>
    <div class="gutter-rows"></div>
  </aside>
  <aside id="gutter-rig" class="gutter" aria-hidden="true">
    <div class="gutter-title">RIG STATUS</div>
    <div class="rig-rows"></div>
  </aside>

  <script type="module" src="src/main.js"></script>
</body>
</html>
